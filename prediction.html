<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prediction Results - PT501</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <!-- jsPDF (for PDF export) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white p-6">
  <!-- Top bar with logout button -->
  <div class="flex justify-end mb-4">
    <button id="logoutBtn"
      class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded">
      Logout
    </button>
  </div>

  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">
      Prediction Results (PT501 - Pressure in 3 Phase Separator (MPA))
    </h1>

    <div id="meta" class="mb-6 text-sm text-gray-300"></div>

    <div id="plot-preds" class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[500px]"></div>
    <div id="plot-cva"   class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[600px]"></div>
    <div id="plot-shap"  class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[500px]"></div>

    <div class="flex gap-3">
      <button id="btnReport"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
        Download PDF Report
      </button>
      <!-- Export button will be injected after GT evaluation if available -->
    </div>
  </div>

  <script>
    // === Load prediction results saved by upload.html ===
    const res = JSON.parse(sessionStorage.getItem("predictionResult") || "null");
    if (!res) {
      alert("No prediction data found. Please upload a CSV first.");
      window.location.href = "upload.html";
    }

    // Find PT501 index
    const targetName = "PT501";
    const j = Array.isArray(res.targets) ? res.targets.indexOf(targetName) : -1;
    if (j === -1) {
      document.getElementById("meta").innerHTML =
        `<div class="text-red-400">Error: PT501 not found in model targets.</div>`;
      throw new Error("PT501 not in targets");
    }

    const t = res.time_index || [];
    const hasTruth = Array.isArray(res.y_true) && res.y_true.length > 0;

    // === Meta info ===
    const meta = document.getElementById("meta");
    meta.innerHTML = `
      <div>Target variable: <code>${targetName}</code> (MPa)</div>
      ${hasTruth ? "" : "<div class='text-yellow-400 mt-1'>No ground-truth values — predictions only.</div>"}
    `;

    // === Plot configs ===
    const baseLayout = {
      margin: { t: 40, r: 20, b: 50, l: 50 },
      hovermode: "x unified",
      dragmode: "pan",
      uirevision: true,
      legend: { orientation: "h", y: -0.2, font: { size: 11 } }
    };
    const baseConfig = {
      responsive: true, displaylogo: false, scrollZoom: true,
      modeBarButtonsToRemove: [
        "select2d","lasso2d","zoom","zoomIn2d","zoomOut2d","autoScale2d","resetScale2d","toggleSpikelines"
      ]
    };

    /* =========================
       HELPERS (matching + metrics)
    ==========================*/
    function toMs(x) { const d = new Date(x); return isNaN(d) ? null : d.getTime(); }

    function normalizeEndpoints(start, end, axisSamples) {
      let s = start, e = end;
      if (typeof s === "number" && typeof e === "number" && s > e) [s, e] = [e, s];
      const axisMs = toMs(axisSamples[0]);
      if (axisMs !== null) {
        const sMs = toMs(s), eMs = toMs(e);
        if (sMs !== null && eMs !== null) return { s: Math.min(sMs, eMs), e: Math.max(sMs, eMs), scale: "time" };
      }
      const sNum = Number(s), eNum = Number(e);
      return { s: Math.min(sNum, eNum), e: Math.max(sNum, eNum), scale: "num" };
    }

    function clearAllMetrics() {
  localStorage.removeItem("fault_metrics_registry");
  alert("All time-based metrics cleared.");
}


    function windowsFromMask(xs, mask) {
      const wins = [];
      let i = 0;
      while (i < mask.length) {
        if (mask[i]) {
          const s = i;
          while (i < mask.length && mask[i]) i++;
          const e = i - 1;
          wins.push([s, e]);
        } else i++;
      }
      return wins.map(([s,e]) => ({ sIdx: s, eIdx: e, sX: xs[s], eX: xs[e] }));
    }

    function mapWindowToScalar(win, scale) {
      if (scale === "time") return { s: toMs(win.sX), e: toMs(win.eX) };
      return { s: Number(win.sX), e: Number(win.eX) };
    }

    function overlapLen(a, b) { const s = Math.max(a.s, b.s); const e = Math.min(a.e, b.e); return Math.max(0, e - s); }
    function unionLen(a, b) { return (Math.max(a.e, b.e) - Math.min(a.s, b.s)); }

    // Returns {TP, FP, FN, pairs:[{gtId,detIdx,overlap,iou,delay}], delays[]}
    function evaluateWindows(detectedWins, gtWins, axisScale, iouThresh = 0.0) {
      const det = detectedWins.map(w => mapWindowToScalar(w, axisScale));
      const gt  = gtWins.map(w  => w.scalar);
      const usedDet = new Set(), usedGt = new Set();
      const pairs = [], delays = [];

      for (let g = 0; g < gt.length; g++) {
        let bestDet = -1, bestOverlap = 0, bestIou = 0;
        for (let d = 0; d < det.length; d++) {
          if (usedDet.has(d)) continue;
          const ov = overlapLen(gt[g], det[d]);
          if (ov > 0) {
            const iou = ov / unionLen(gt[g], det[d]);
            if (iou >= iouThresh && ov > bestOverlap) { bestOverlap = ov; bestIou = iou; bestDet = d; }
          }
        }
        if (bestDet >= 0) {
          usedDet.add(bestDet); usedGt.add(g);
          const delay = Math.max(0, det[bestDet].s - gt[g].s);
          delays.push(delay);
          pairs.push({ gtId: gtWins[g].id ?? `gt${g+1}`, detIdx: bestDet, overlap: bestOverlap, iou: bestIou, delay });
        }
      }
      const TP = pairs.length;
      const FN = gt.length - usedGt.size;
      const FP = det.length - usedDet.size;
      return { TP, FP, FN, pairs, delays };
    }

    function computeMetricsPerStat({ tCVA, maskT2, maskQ, gtWindows }) {
      const axisScale = (toMs(tCVA[0]) !== null && toMs(tCVA[tCVA.length-1]) !== null) ? "time" : "num";
      const gtNorm = gtWindows.map(w => {
        const { s, e } = normalizeEndpoints(w.start, w.end, tCVA);
        return { id: w.id, scalar: { s, e } };
      });

      const detT2 = windowsFromMask(tCVA, maskT2);
      const detQ  = windowsFromMask(tCVA, maskQ);

      const mT2 = evaluateWindows(detT2, gtNorm, axisScale, 0.0);
      const mQ  = evaluateWindows(detQ,  gtNorm, axisScale, 0.0);

      const meanDelay = (arr) => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;
      const toSummary = (m) => ({
        TP: m.TP,
        FP: m.FP,
        FN: m.FN,
        detection_rate: gtNorm.length ? m.TP / gtNorm.length : 0,
        false_alarm_rate: (m.TP + m.FP) ? m.FP / (m.TP + m.FP) : 0,
        mean_delay_s: axisScale === "time" ? meanDelay(m.delays)/1000 : meanDelay(m.delays)
      });

      return {
        axisScale,
        T2: { ...toSummary(mT2), details: mT2 },
        Q:  { ...toSummary(mQ),  details: mQ  },
        counts: { expected: gtNorm.length, detected_T2: detT2.length, detected_Q: detQ.length },
        _gtNorm: gtNorm // pass through for time-based
      };
    }

    // ===== Registry for metrics (store time-based) =====
    function saveMetrics(datasetId, metricsWindow, metricsTime) {
      const key = "fault_metrics_registry";
      const reg = JSON.parse(localStorage.getItem(key) || "{}");
      // Store both, but we will export the *time-based* metrics
      reg[datasetId] = {
        window: metricsWindow,
        time: metricsTime   // { axisScale, unit, T2:{...}, Q:{...} }
      };
      localStorage.setItem(key, JSON.stringify(reg));
    }

    // Export *time-based* metrics to CSV with formatted percentages like the example
    function exportMetricsCSV() {
      const key = "fault_metrics_registry";
      const reg = JSON.parse(localStorage.getItem(key) || "{}");

      // CSV header
      const rows = [["dataset_id","stat","precision","recall","fp_time"]];

      for (const [ds, entry] of Object.entries(reg)) {
        if (!entry || !entry.time) continue;
        const unit = entry.time.unit || "units";

        // Helper to format one stat (T2 or Q)
        const pushRow = (label, tb) => {
          if (!tb) return;
          const precisionStr = `${(tb.precision_time*100).toFixed(1)}%`;
          const recallStr    = `${(tb.recall_time*100).toFixed(1)}%`;
          const fpStr        = `${tb.fp_time.toFixed(1)} ${unit} (${(tb.fp_frac*100).toFixed(1)}%)`;
          rows.push([ds, label, precisionStr, recallStr, fpStr]);
        };

        pushRow("T2", entry.time.T2);
        pushRow("Q",  entry.time.Q);
      }

      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], {type: "text/csv"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "fault_time_based_metrics.csv"; a.click();
      URL.revokeObjectURL(url);
    }

    /* ========= Time-based metrics helpers ========= */
    function toScalar(x, axisScale) {
      if (axisScale === "time") return (new Date(x)).getTime();
      return Number(x);
    }
    function mergeIntervals(intervals) {
      if (!intervals.length) return [];
      const sorted = intervals.slice().sort((a,b)=> a.s - b.s || a.e - b.e);
      const out = [sorted[0]];
      for (let i=1;i<sorted.length;i++){
        const last = out[out.length-1];
        const cur = sorted[i];
        if (cur.s <= last.e) {
          last.e = Math.max(last.e, cur.e);
        } else {
          out.push({s: cur.s, e: cur.e});
        }
      }
      return out;
    }
    function intervalsLen(intervals) {
      return intervals.reduce((acc, iv)=> acc + Math.max(0, iv.e - iv.s), 0);
    }
    function intersectionsLen(A, B) {
      let i=0, j=0, sum=0;
      while (i<A.length && j<B.length) {
        const a = A[i], b = B[j];
        const s = Math.max(a.s, b.s);
        const e = Math.min(a.e, b.e);
        if (e > s) sum += (e - s);
        if (a.e < b.e) i++; else j++;
      }
      return sum;
    }
    function computeTimeBasedForStat(detectedWins, gtNorm, axisScale) {
      const detIntervals = mergeIntervals(detectedWins.map(w => ({
        s: toScalar(w.sX, axisScale),
        e: toScalar(w.eX, axisScale)
      })).filter(iv => isFinite(iv.s) && isFinite(iv.e) && iv.e > iv.s));

      const gtIntervals = mergeIntervals(gtNorm.map(w => ({ s: w.scalar.s, e: w.scalar.e })));

      const det_len = intervalsLen(detIntervals);
      const gt_len  = intervalsLen(gtIntervals);
      const overlap = intersectionsLen(detIntervals, gtIntervals);
      const fp_time = Math.max(0, det_len - overlap);

      const precision_time = det_len > 0 ? (overlap / det_len) : 0;
      const recall_time    = gt_len  > 0 ? (overlap / gt_len)  : 0;
      const fp_frac        = det_len > 0 ? (fp_time / det_len) : 0;

      return { precision_time, recall_time, fp_time, fp_frac, overlap, det_len, gt_len };
    }
    /* ===== End helpers ===== */

    // === PT501 Predictions (no residuals) ===
    const yPred = (res.y_pred || []).map(r => r[j]);
    let yTrue = null;
    if (hasTruth) {
      yTrue = res.y_true.map(row => Array.isArray(row) ? row[j] : row);
    }

    const tracesPred = [{ x: t, y: yPred, mode: "lines", name: "PT501 Predicted", yaxis: "y1" }];
    if (hasTruth) {
      const n = Math.min(t.length, yPred.length, yTrue.length);
      tracesPred.push({
        x: t.slice(0, n), y: yTrue.slice(0, n),
        mode: "lines", name: "PT501 Actual", yaxis: "y1"
      });
    }

    Plotly.newPlot("plot-preds", tracesPred, {
      ...baseLayout,
      title: hasTruth ? "PT501: Predicted vs Actual" : "Predicted PT501",
      yaxis: { title: "Value (MPa)" }
    }, baseConfig);

    // Keep a global to assemble the report later
    window.ReportData = {};

    // === CVA plot (shade per-plot only where that metric exceeds its threshold) ===
    (() => {
      // 1) Raw arrays
      let tCVA = (res.cva?.t || []).slice();
      let T2   = (res.cva?.T2 || []).slice();
      let Q    = (res.cva?.Q  || []).slice();
      const T2_UCL = Number(res.cva?.T2_UCL ?? 0);
      const Q_UCL  = Number(res.cva?.Q_UCL  ?? 0);

      if (!tCVA.length || !T2.length || !Q.length) {
        document.getElementById("plot-cva").innerHTML =
          "<div class='text-yellow-400'>CVA not available (missing arrays or UCLs).</div>";
        return;
      }

      // 2) Burn-in (first samples spike due to block formation)
      const burnIn = Math.min(50, T2.length - 1);
      if (burnIn > 0) {
        tCVA = tCVA.slice(burnIn);
        T2   = T2.slice(burnIn);
        Q    = Q.slice(burnIn);
      }

      // 3) Masks and windows
      const maskT2  = T2.map(v => v > T2_UCL);
      const maskQ   = Q.map(v => v > Q_UCL);
      const maskAny = maskT2.map((v,i) => v || maskQ[i]);

      function findWindows(mask) {
        const wins = [];
        let i = 0;
        while (i < mask.length) {
          if (mask[i]) {
            const s = i;
            while (i < mask.length && mask[i]) i++;
            wins.push([s, i - 1]);
          } else i++;
        }
        return wins;
      }

      const windowsT2  = findWindows(maskT2);
      const windowsQ   = findWindows(maskQ);
      const windowsAny = findWindows(maskAny); // for the table/PDF (union)

      // 4) Traces
      const tracesCVA = [
        { x: tCVA, y: T2, mode: "lines", name: "T²", xaxis: "x",  yaxis: "y"  },
        { x: tCVA, y: tCVA.map(() => T2_UCL), mode: "lines", name: "T² UCL", line: { dash: "dash" }, xaxis: "x",  yaxis: "y"  },
        { x: tCVA, y: Q,  mode: "lines", name: "Q",  xaxis: "x2", yaxis: "y2" },
        { x: tCVA, y: tCVA.map(() => Q_UCL),  mode: "lines", name: "Q UCL",  line: { dash: "dash" }, xaxis: "x2", yaxis: "y2" }
      ];

      // 5) Axis ranges (cap for readability)
      const capT2 = 1e4, capQ = 1e4;
      const maxT2 = Math.max(...T2), maxQ = Math.max(...Q);

      // 6) Shapes & annotations (shade only on the subplot that breaches)
      const shapes = [];
      const annotations = [];
      const maxWindowsToDraw = Infinity;

      // T²-only shading on top subplot
      for (let k = 0; k < Math.min(maxWindowsToDraw, windowsT2.length); k++) {
        const [s, e] = windowsT2[k];
        const x0 = tCVA[s], x1 = tCVA[e];

        shapes.push(
          { type: "rect", xref: "x", yref: "paper", x0, x1, y0: 0.52, y1: 0.98, fillcolor: "rgba(255,99,71,0.15)", line: { width: 0 } },
          { type: "line", xref: "x", yref: "y", x0, x1: x0, y0: 0, y1: Math.min(capT2, maxT2*1.1), line: { color: "tomato", width: 1, dash: "dot" } },
          { type: "line", xref: "x", yref: "y", x0: x1, x1, y0: 0, y1: Math.min(capT2, maxT2*1.1), line: { color: "tomato", width: 1, dash: "dot" } }
        );

        annotations.push(
          { x: x0, y: Math.min(capT2, maxT2*1.15), xref: "x", yref: "y", text: "Fault Start", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" },
          { x: x1, y: Math.min(capT2, maxT2*1.15), xref: "x", yref: "y", text: "Fault End", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" }
        );
      }

      // Q-only shading on bottom subplot
      for (let k = 0; k < Math.min(maxWindowsToDraw, windowsQ.length); k++) {
        const [s, e] = windowsQ[k];
        const x0 = tCVA[s], x1 = tCVA[e];

        shapes.push(
          { type: "rect", xref: "x2", yref: "paper", x0, x1, y0: 0.02, y1: 0.48, fillcolor: "rgba(255,99,71,0.15)", line: { width: 0 } },
          { type: "line", xref: "x2", yref: "y2", x0, x1: x0, y0: 0, y1: Math.min(capQ, maxQ*1.1), line: { color: "tomato", width: 1, dash: "dot" } },
          { type: "line", xref: "x2", yref: "y2", x0: x1, x1, y0: 0, y1: Math.min(capQ, maxQ*1.1), line: { color: "tomato", width: 1, dash: "dot" } }
        );

        annotations.push(
          { x: x0, y: Math.min(capQ, maxQ*1.15), xref: "x2", yref: "y2", text: "Fault Start", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" },
          { x: x1, y: Math.min(capQ, maxQ*1.15), xref: "x2", yref: "y2", text: "Fault End", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" }
        );
      }

      // 7) Layout
      const layoutCVA = {
        ...baseLayout,
        title: "CVA Indices (Raw)",
        height: 600,
        grid: { rows: 2, columns: 1, pattern: "independent" },
        xaxis:  { title: "Time" },
        yaxis:  { title: "Hotelling T²", range: [0, Math.min(capT2, maxT2*1.2)] },
        xaxis2: { title: "Time" },
        yaxis2: { title: "Squared Prediction Error Q", range: [0, Math.min(capQ, maxQ*1.2)] },
        shapes,
        annotations
      };

      Plotly.newPlot("plot-cva", tracesCVA, layoutCVA, baseConfig);

      // 8) Breach rates (separate)
      const rateT2 = maskT2.length ? maskT2.filter(Boolean).length / maskT2.length : 0;
      const rateQ  = maskQ.length  ? maskQ.filter(Boolean).length  / maskQ.length  : 0;
      meta.insertAdjacentHTML("beforeend",
        `<div class="mt-1">T² breach rate: <strong>${(rateT2*100).toFixed(2)}%</strong></div>`);
      meta.insertAdjacentHTML("beforeend",
        `<div class="mt-1">Q breach rate: <strong>${(rateQ*100).toFixed(2)}%</strong></div>`);

      // 9) Build ranges (union windows) using EXACT x-axis + correct duration
      const windowsAnyUnion = windowsFromMask(tCVA, maskT2.map((v,i)=> v || maskQ[i]));
      const faultRanges = windowsAnyUnion.map(w => {
        const x0 = w.sX, x1 = w.eX;

        // Duration = end - start (seconds if timestamps; raw delta if numeric)
        let durationSec = null;
        let durationLabel = "—";

        const d0 = new Date(x0), d1 = new Date(x1);
        if (!isNaN(d0) && !isNaN(d1)) {
          durationSec = (d1 - d0) / 1000; // seconds
          durationLabel = durationSec.toFixed(1) + " s";
        } else if (isFinite(Number(x0)) && isFinite(Number(x1))) {
          durationSec = Number(x1) - Number(x0);
          durationLabel = String(durationSec);
        }

        const s = w.sIdx, e = w.eIdx;
        const T2seg = T2.slice(s, e + 1);
        const Qseg  = Q.slice(s, e + 1);

        return {
          startIdx: s, endIdx: e,
          start: String(x0), end: String(x1),
          durationSec, durationLabel,
          maxT2: Math.max(...T2seg),
          maxQ: Math.max(...Qseg)
        };
      });

      // Save for report
      window.ReportData = window.ReportData || {};
      window.ReportData.cva = {
        t: tCVA, T2, Q, T2_UCL, Q_UCL,
        faultWindows: windowsAnyUnion,
        faultRanges,
        maxT2, maxQ
      };

      // === Evaluate against ground-truth (per-stat + time-based) ===
      (async function evaluateAgainstGT() {
        try {
          const gtMap = await fetch("fault_ground_truth.json", { cache: "no-store" }).then(r => r.json());
          const datasetId = String(res.dataset_id || "UNKNOWN");
          const gtEntry = gtMap[datasetId];

          if (!gtEntry || !Array.isArray(gtEntry.windows)) {
            meta.insertAdjacentHTML("beforeend",
              `<div class="mt-1 text-orange-400">No ground-truth windows found for dataset <b>${datasetId}</b>.</div>`);
            return;
          }

          // Window-level metrics (TP/FP/FN)
          const metrics = computeMetricsPerStat({ tCVA, maskT2, maskQ, gtWindows: gtEntry.windows });

          // Time-based metrics
          const detT2Wins = windowsFromMask(tCVA, maskT2);
          const detQWins  = windowsFromMask(tCVA, maskQ);
          const axisScale = metrics.axisScale;
          const gtNorm = metrics._gtNorm;

          const tbT2 = computeTimeBasedForStat(detT2Wins, gtNorm, axisScale);
          const tbQ  = computeTimeBasedForStat(detQWins,  gtNorm, axisScale);

          const unit = axisScale === "time" ? "s" : "units";

          // Display summaries
          meta.insertAdjacentHTML("beforeend",
            `<div class="mt-2">
               <div><b>Dataset:</b> ${datasetId}</div>
               <div><b>T²</b> — DR: ${(metrics.T2.detection_rate*100).toFixed(1)}%, FAR: ${(metrics.T2.false_alarm_rate*100).toFixed(1)}%, Mean delay: ${metrics.T2.mean_delay_s.toFixed(2)} ${axisScale==="time"?"s":""}</div>
               <div><b>Q</b>  — DR: ${(metrics.Q.detection_rate*100).toFixed(1)}%, FAR: ${(metrics.Q.false_alarm_rate*100).toFixed(1)}%, Mean delay: ${metrics.Q.mean_delay_s.toFixed(2)} ${axisScale==="time"?"s":""}</div>
             </div>`);

          meta.insertAdjacentHTML("beforeend",
            `<div class="mt-2">
               <div class="font-semibold">Time-based metrics</div>
               <div><b>T²</b> — Precision: ${(tbT2.precision_time*100).toFixed(1)}%, Recall: ${(tbT2.recall_time*100).toFixed(1)}%, FP time: ${tbT2.fp_time.toFixed(1)} ${unit} (${(tbT2.fp_frac*100).toFixed(1)}%)</div>
               <div><b>Q</b>  — Precision: ${(tbQ.precision_time*100).toFixed(1)}%, Recall: ${(tbQ.recall_time*100).toFixed(1)}%, FP time: ${tbQ.fp_time.toFixed(1)} ${unit} (${(tbQ.fp_frac*100).toFixed(1)}%)</div>
             </div>`);

          // Persist for PDF
          window.ReportData.metrics = metrics;
          window.ReportData.metrics_time = { axisScale, unit, T2: tbT2, Q: tbQ };
          window.ReportData.datasetId = datasetId;

          // Keep CSV export for window-level
          saveMetrics(datasetId, metrics, { axisScale, unit, T2: tbT2, Q: tbQ });

          if (!document.getElementById("btnExportCSV")) {
          const btn = document.createElement("button");
            btn.id = "btnExportCSV";
            btn.className = "bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded";
            btn.textContent = "Export Time-based Metrics";
            document.getElementById("btnReport").after(btn);
            btn.addEventListener("click", exportMetricsCSV);
          }
        } catch (e) {
          console.error("GT evaluation failed:", e);
        }

        if (!document.getElementById("btnClearCSV")) {
          const clearBtn = document.createElement("button");
          clearBtn.id = "btnClearCSV";
          clearBtn.className = "bg-gray-700 hover:bg-gray-600 text-white font-semibold py-2 px-4 rounded";
          clearBtn.textContent = "Clear Saved Metrics";
          document.getElementById("btnExportCSV").after(clearBtn);
          clearBtn.addEventListener("click", clearAllMetrics);
        }
      })();
    })();

    // === Responsive resize ===
    window.addEventListener("resize", () => {
      Plotly.Plots.resize("plot-preds");
      Plotly.Plots.resize("plot-cva");
      const shap = document.getElementById("plot-shap");
      if (shap && shap.data) Plotly.Plots.resize("plot-shap");
    });

    // === SHAP feature importance (robust: from res, or JSON, else hide) ===
    (async function renderSHAP() {
      const shapDiv = document.getElementById("plot-shap");

      function drawSHAP(items) {
        const x = items.map(d => d.feature);
        const y = items.map(d => d.score);
        return Plotly.newPlot("plot-shap", [{
          type: "bar", x, y, name: "Impact (mean |SHAP|)"
        }], {
          title: "Which sensors influence PT501 predictions?",
          margin: { t: 40, r: 20, b: 80, l: 60 },
          xaxis: { tickangle: -30 },
          yaxis: { title: "Mean |SHAP| (aggregated over time)" },
          paper_bgcolor: "#1f2937", plot_bgcolor: "#1f2937",
          font: { color: "#fff" }
        }, { responsive: true, displaylogo: false });
      }

      let items = null;

      // Try 1: from session result
      if (res?.shap?.feature_importance && Array.isArray(res.shap.feature_importance)) {
        items = res.shap.feature_importance;
      }

      // Try 2: fetch JSON
      if (!items) {
        try {
          const r = await fetch("shap_importance_pt501.json", { cache: "no-store" });
          if (r.ok) {
            const data = await r.json();
            if (data?.feature_importance && Array.isArray(data.feature_importance)) {
              items = data.feature_importance;
            }
          }
        } catch (e) {
          console.warn("SHAP fetch failed:", e);
        }
      }

      // Render or hide
      if (items && items.length) {
        await drawSHAP(items.slice(0, 15));
      } else {
        shapDiv.style.display = "none";
        meta.insertAdjacentHTML(
          "beforeend",
          `<div class="mt-1 text-gray-400">SHAP importance not available for PT501.</div>`
        );
      }
    })();

    // === PDF Generation ===
    async function plotToPNG(divId, scale = 2) {
      const el = document.getElementById(divId);
      await Plotly.Plots.resize(el);
      return await Plotly.toImage(el, { format: "png", scale });
    }

    document.getElementById("btnReport").addEventListener("click", async () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "mm", format: "a4" });

      // --- Header
      const title = "Predictive Maintenance Report — PT501";
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text(title, 14, 16);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 22);

      // Gather prepared data
      const rd = window.ReportData || {};
      const cva = rd.cva || {};

      const t2Breach = Array.isArray(cva.T2) && isFinite(cva.T2_UCL)
        ? cva.T2.some(v => v > cva.T2_UCL) : false;
      const qBreach = Array.isArray(cva.Q) && isFinite(cva.Q_UCL)
        ? cva.Q.some(v => v > cva.Q_UCL) : false;

      // --- Summary
      let y = 30;
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("1) Summary", 14, y);
      y += 6; doc.setFontSize(10); doc.setFont("helvetica","normal");
      doc.text(`T² exceeded UCL: ${t2Breach ? "Yes" : "No"} (UCL=${(cva.T2_UCL ?? "n/a")})`, 14, y); y += 5;
      doc.text(`Q exceeded UCL: ${qBreach ? "Yes" : "No"} (UCL=${(cva.Q_UCL ?? "n/a")})`, 14, y); y += 8;

      // --- Detection Metrics (window-level)
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("2) Detection Metrics (window-level)", 14, y); y += 6;
      doc.setFontSize(10); doc.setFont("helvetica","normal");
      const M = (window.ReportData.metrics || null);
      if (M) {
        const line = (name, s) => `${name}: TP=${s.TP}, FP=${s.FP}, FN=${s.FN}, DR=${(s.detection_rate*100).toFixed(1)}%, FAR=${(s.false_alarm_rate*100).toFixed(1)}%, Mean delay=${Number(s.mean_delay_s).toFixed(2)}${M.axisScale==="time"?"s":""}`;
        doc.text(`Dataset: ${window.ReportData.datasetId || "-"}`, 14, y); y += 5;
        doc.text(line("T²", M.T2), 14, y); y += 5;
        doc.text(line("Q",  M.Q),  14, y); y += 8;
      } else {
        doc.text("Ground-truth not available for this dataset.", 14, y); y += 8;
      }

      // --- Time-based Metrics
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("2b) Time-based Metrics", 14, y); y += 6;
      doc.setFontSize(10); doc.setFont("helvetica","normal");
      const MT = window.ReportData.metrics_time || null;
      if (MT) {
        const unit = MT.unit || "units";
        const fmt = (tb) => `Precision=${(tb.precision_time*100).toFixed(1)}%, Recall=${(tb.recall_time*100).toFixed(1)}%, FP time=${tb.fp_time.toFixed(1)} ${unit} (${(tb.fp_frac*100).toFixed(1)}%)`;
        doc.text(`T² — ${fmt(MT.T2)}`, 14, y); y += 5;
        doc.text(`Q  — ${fmt(MT.Q)}`, 14, y); y += 8;
      } else {
        doc.text("Time-based metrics not available.", 14, y); y += 8;
      }

      // --- Abnormal windows table (union)
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("3) Abnormal Time Windows (exceeded threshold)", 14, y);
      y += 6; doc.setFontSize(10); doc.setFont("helvetica","normal");

      const rows = (cva.faultRanges || []);
      // Table header
      doc.text("No.", 14 + 2, y);
      doc.text("Start (x-axis)", 14 + 20 + 2, y);
      doc.text("End (x-axis)",   14 + 20 + 60 + 2, y);
      doc.text("Duration(s)",    14 + 20 + 60 + 60 + 2, y);
      doc.text("Max T² / Q",     14 + 20 + 60 + 60 + 22 + 2, y);
      y += 4;

      for (let idx = 0; idx < rows.length; idx++) {
        const r = rows[idx];
        if (y > 270) { doc.addPage(); y = 20; }
        doc.text(String(idx + 1), 14 + 2, y);
        doc.text(String(r.start), 14 + 20 + 2, y);
        doc.text(String(r.end),   14 + 20 + 60 + 2, y);
        doc.text(r.durationLabel || "—", 14 + 20 + 60 + 60 + 2, y);
        doc.text(`${(r.maxT2 ?? 0).toFixed(2)} / ${(r.maxQ ?? 0).toFixed(2)}`, 14 + 20 + 60 + 60 + 22 + 2, y);
        y += 6;
      }

      // --- Charts page
      doc.addPage();
      doc.setFontSize(12); doc.setFont("helvetica","bold");
      doc.text("4) Diagnostic Charts", 14, 16);
      doc.setFont("helvetica","normal"); doc.setFontSize(10);

      const predsPNG = await plotToPNG("plot-preds", 2);
      const cvaPNG   = await plotToPNG("plot-cva", 2);
      let shapPNG = null;
      const shapEl = document.getElementById("plot-shap");
      if (shapEl && shapEl.data) shapPNG = await plotToPNG("plot-shap", 2);

      let imgY = 22;
      const imgW = 180, imgH = 80;
      doc.addImage(predsPNG, "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
      doc.addImage(cvaPNG,   "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
      if (shapPNG) {
        if (imgY > 250) { doc.addPage(); imgY = 20; }
        doc.addImage(shapPNG, "PNG", 14, imgY, imgW, imgH);
      }

      // --- Save
      doc.save("Maintenance_Report_PT501.pdf");
    });

    

    // Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
