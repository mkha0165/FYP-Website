<!-- prediction.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prediction Results - PT501</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <!-- jsPDF (for PDF export) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white p-6">
  <div class="max-w-6xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">
      Prediction Results (PT501 - Pressure in 3 Phase Separator (MPA))
    </h1>

    <div id="meta" class="mb-6 text-sm text-gray-300"></div>

    <div id="plot-preds" class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[500px]"></div>
    <div id="plot-cva"   class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[600px]"></div>

    <!-- Contribution plot -->
    <div class="bg-gray-800 rounded-xl p-4 mb-6 w-full">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Contribution (C) – Top Drivers</h2>
        <div class="flex items-center gap-2 text-sm text-gray-300">
          Focus @ t:
          <input id="kSelect" type="number" class="w-24 bg-gray-700 rounded-lg px-2 py-1" value="0" />
          <button id="btnApplyK" class="px-3 py-1 rounded-lg bg-slate-700 hover:bg-slate-600">Apply</button>
        </div>
      </div>
      <p class="text-xs text-gray-400 mb-2">
        Bars show variable-level contributions at the selected time index (retained-space C and residual-space Q).
        Defaults to the first threshold breach; otherwise the maximum of normalized T²/Q.
      </p>
      <div id="plot-contrib" class="w-full h-[520px]"></div>
    </div>

    <div id="plot-shap"  class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[500px]"></div>

    <button id="btnReport"
      class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
      Download PDF Report
    </button>
  </div>

  <script>
    // ===== API base (same-origin in prod, localhost in dev) =====
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "http://127.0.0.1:8000"
      : ""; // same-origin on Render

    async function loadResult() {
      try {
        const r = await fetch(`${API_BASE}/result/latest`, { cache: "no-store" });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
      } catch (e) {
        alert("No prediction data found. Please upload a CSV first.");
        window.location.href = "upload.html";
        throw e;
      }
    }

    // All render logic is inside this IIFE after we fetch the result from the server cache
    (async () => {
      const res = await loadResult();

      // === Find PT501 index
      const targetName = "PT501";
      const j = Array.isArray(res.targets) ? res.targets.indexOf(targetName) : -1;
      if (j === -1) {
        document.getElementById("meta").innerHTML =
          `<div class="text-red-400">Error: PT501 not found in model targets.</div>`;
        throw new Error("PT501 not in targets");
      }

      const t = res.time_index || [];
      const hasTruth = Array.isArray(res.y_true) && res.y_true.length > 0;

      // === Meta info
      const meta = document.getElementById("meta");
      meta.innerHTML = `
        <div>Target variable: <code>${targetName}</code> (MPa)</div>
        ${hasTruth ? "" : "<div class='text-yellow-400 mt-1'>No ground-truth values — predictions only.</div>"}
      `;

      // === Plot configs
      const baseLayout = {
        margin: { t: 40, r: 20, b: 50, l: 50 },
        hovermode: "x unified",
        dragmode: "pan",
        uirevision: true,
        legend: { orientation: "h", y: -0.2, font: { size: 11 } }
      };
      const baseConfig = {
        responsive: true, displaylogo: false, scrollZoom: true,
        modeBarButtonsToRemove: [
          "select2d","lasso2d","zoom","zoomIn2d","zoomOut2d","autoScale2d","resetScale2d","toggleSpikelines"
        ]
      };

      // === Predictions plot
      const yPred = (res.y_pred || []).map(r => r[j]);
      let yTrue = null;
      if (hasTruth) yTrue = res.y_true.map(row => Array.isArray(row) ? row[j] : row);

      const tracesPred = [{ x: t, y: yPred, mode: "lines", name: "PT501 Predicted", yaxis: "y1" }];
      if (hasTruth) {
        const n = Math.min(t.length, yPred.length, yTrue.length);
        tracesPred.push({ x: t.slice(0, n), y: yTrue.slice(0, n), mode: "lines", name: "PT501 Actual", yaxis: "y1" });
      }
      Plotly.newPlot("plot-preds", tracesPred, {
        ...baseLayout,
        title: hasTruth ? "PT501: Predicted vs Actual" : "Predicted PT501",
        yaxis: { title: "Value (MPa)" }
      }, baseConfig);

      // Keep for report
      window.ReportData = {};

      // === CVA plot + windows
      (function renderCVA() {
        let tCVA = (res.cva?.t || []).slice();
        let T2   = (res.cva?.T2 || []).slice();
        let Q    = (res.cva?.Q  || []).slice();
        const T2_UCL = Number(res.cva?.T2_UCL ?? 0);
        const Q_UCL  = Number(res.cva?.Q_UCL  ?? 0);

        if (!tCVA.length || !T2.length || !Q.length) {
          document.getElementById("plot-cva").innerHTML =
            "<div class='text-yellow-400'>CVA not available (missing arrays or UCLs).</div>";
          return;
        }

        const burnIn = Math.min(50, T2.length - 1);
        if (burnIn > 0) {
          tCVA = tCVA.slice(burnIn);
          T2   = T2.slice(burnIn);
          Q    = Q.slice(burnIn);
        }

        const maskT2  = T2.map(v => v > T2_UCL);
        const maskQ   = Q.map(v => v > Q_UCL);
        const maskAny = maskT2.map((v,i) => v || maskQ[i]);

        function findWindows(mask) {
          const wins = []; let i = 0;
          while (i < mask.length) {
            if (mask[i]) { const s=i; while (i<mask.length && mask[i]) i++; wins.push([s, i-1]); }
            else i++;
          }
          return wins;
        }
        const windowsT2  = findWindows(maskT2);
        const windowsQ   = findWindows(maskQ);
        const windowsAny = findWindows(maskAny);

        const tracesCVA = [
          { x: tCVA, y: T2, mode: "lines", name: "T²", xaxis: "x",  yaxis: "y"  },
          { x: tCVA, y: tCVA.map(() => T2_UCL), mode: "lines", name: "T² UCL", line: { dash: "dash" }, xaxis: "x",  yaxis: "y"  },
          { x: tCVA, y: Q,  mode: "lines", name: "Q",  xaxis: "x2", yaxis: "y2" },
          { x: tCVA, y: tCVA.map(() => Q_UCL),  mode: "lines", name: "Q UCL",  line: { dash: "dash" }, xaxis: "x2", yaxis: "y2" }
        ];

        const capT2 = 1e4, capQ = 1e4;
        const maxT2 = Math.max(...T2), maxQ = Math.max(...Q);

        const shapes = [], annotations = [];
        const maxWindowsToDraw = 20;

        for (let k = 0; k < Math.min(maxWindowsToDraw, windowsT2.length); k++) {
          const [s, e] = windowsT2[k];
          const x0 = tCVA[s], x1 = tCVA[e];
          shapes.push(
            { type: "rect", xref: "x", yref: "paper", x0, x1, y0: 0.52, y1: 0.98, fillcolor: "rgba(255,99,71,0.15)", line: { width: 0 } },
            { type: "line", xref: "x", yref: "y", x0, x1: x0, y0: 0, y1: Math.min(capT2, maxT2*1.1), line: { width: 1, dash: "dot" } },
            { type: "line", xref: "x", yref: "y", x0: x1, x1, y0: 0, y1: Math.min(capT2, maxT2*1.1), line: { width: 1, dash: "dot" } }
          );
          annotations.push(
            { x: x0, y: Math.min(capT2, maxT2*1.15), xref: "x", yref: "y", text: "Fault Start", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { size: 12 } },
            { x: x1, y: Math.min(capT2, maxT2*1.15), xref: "x", yref: "y", text: "Fault End",   showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { size: 12 } }
          );
        }

        for (let k = 0; k < Math.min(maxWindowsToDraw, windowsQ.length); k++) {
          const [s, e] = windowsQ[k];
          const x0 = tCVA[s], x1 = tCVA[e];
          shapes.push(
            { type: "rect", xref: "x2", yref: "paper", x0, x1, y0: 0.02, y1: 0.48, fillcolor: "rgba(255,99,71,0.15)", line: { width: 0 } },
            { type: "line", xref: "x2", yref: "y2", x0, x1: x0, y0: 0, y1: Math.min(capQ, maxQ*1.1), line: { width: 1, dash: "dot" } },
            { type: "line", xref: "x2", yref: "y2", x0: x1, x1, y0: 0, y1: Math.min(capQ, maxQ*1.1), line: { width: 1, dash: "dot" } }
          );
          annotations.push(
            { x: x0, y: Math.min(capQ, maxQ*1.15), xref: "x2", yref: "y2", text: "Fault Start", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { size: 12 } },
            { x: x1, y: Math.min(capQ, maxQ*1.15), xref: "x2", yref: "y2", text: "Fault End",   showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { size: 12 } }
          );
        }

        const layoutCVA = {
          ...baseLayout,
          title: "CVA Indices (Raw)",
          height: 600,
          grid: { rows: 2, columns: 1, pattern: "independent" },
          xaxis:  { title: "Time" },
          yaxis:  { title: "Hotelling T²", range: [0, Math.min(1e4, maxT2*1.2)] },
          xaxis2: { title: "Time" },
          yaxis2: { title: "Squared Prediction Error Q", range: [0, Math.min(1e4, maxQ*1.2)] },
          shapes, annotations
        };
        Plotly.newPlot("plot-cva", tracesCVA, layoutCVA, baseConfig);

        const rateT2 = maskT2.length ? maskT2.filter(Boolean).length / maskT2.length : 0;
        const rateQ  = maskQ.length  ? maskQ.filter(Boolean).length  / maskQ.length  : 0;
        meta.insertAdjacentHTML("beforeend", `<div class="mt-1">T² breach rate: <strong>${(rateT2*100).toFixed(2)}%</strong></div>`);
        meta.insertAdjacentHTML("beforeend", `<div class="mt-1">Q breach rate: <strong>${(rateQ*100).toFixed(2)}%</strong></div>`);

        // union windows with exact x values for report
        const faultRanges = (function buildRanges() {
          function findWindows(mask) {
            const arr = []; let i=0;
            while (i < mask.length) {
              if (mask[i]) { const s=i; while (i<mask.length && mask[i]) i++; arr.push([s,i-1]); }
              else i++;
            }
            return arr;
          }
          const wins = findWindows(maskAny);
          return wins.map(([s,e])=>{
            const x0=tCVA[s], x1=tCVA[e];
            let durationLabel="—";
            const d0=new Date(x0), d1=new Date(x1);
            if (!isNaN(d0) && !isNaN(d1)) durationLabel=((d1-d0)).toFixed(1)+" s";
            else if (isFinite(Number(x0)) && isFinite(Number(x1))) durationLabel=String(Number(x1)-Number(x0));
            return {
              startIdx:s, endIdx:e, start:String(x0), end:String(x1),
              durationLabel, maxT2:Math.max(...T2.slice(s,e+1)), maxQ:Math.max(...Q.slice(s,e+1))
            };
          });
        })();

        window.ReportData.cva = { t: tCVA, T2, Q, T2_UCL, Q_UCL, faultRanges };
        // default k*: first breach else argmax normalized
        const T2N = T2_UCL ? T2.map(v=>v/T2_UCL) : T2;
        const QN  = Q_UCL  ? Q.map(v=>v/Q_UCL)   : Q;
        let kStar = -1;
        for (let i=0;i<T2.length;i++){ if (T2N[i]>1 || QN[i]>1){ kStar=i; break; } }
        if (kStar<0) {
          let best=-Infinity, arg=0;
          for (let i=0;i<T2.length;i++){ const s=Math.max(T2N[i],QN[i]); if (s>=best){best=s; arg=i;} }
          kStar=arg;
        }
        window.ReportData.contribAt = kStar;
        document.getElementById("kSelect").value = kStar;
      })();

      // === Contribution plot
      function renderContrib(kStar) {
        const container = document.getElementById("plot-contrib");
        const contrib = res.cva?.contrib;
        if (!contrib) {
          container.innerHTML = "<div class='text-yellow-400'>Contribution arrays not available.</div>";
          return;
        }
        const names = contrib.features || [];
        const Ctot  = contrib.C_total || [];
        const Cq    = contrib.C_q || [];
        if (!names.length || !Ctot.length) {
          container.innerHTML = "<div class='text-yellow-400'>No contribution data.</div>";
          return;
        }
        const m = names.length;
        const N = (Ctot[0] || []).length;
        if (kStar == null || isNaN(kStar) || kStar < 0) kStar = 0;
        if (kStar >= N) kStar = N - 1;

        const take = (M, k) => Array.from({length:m}, (_,j)=> Math.abs((M[j]||[])[k] || 0));
        const vTot = take(Ctot, kStar);
        const vQ   = take(Cq,   kStar);

        const order = vTot.map((v,i)=>[v,i]).sort((a,b)=> b[0]-a[0]).slice(0, Math.min(10,m)).map(x=>x[1]);
        const labels = order.map(i=> names[i]);
        const valsTot= order.map(i=> vTot[i]);
        const valsQ  = order.map(i=> vQ[i]);

        const traces = [
          { type:"bar", x: valsTot, y: labels, name: "C (retained)", orientation: "h" },
          { type:"bar", x: valsQ,   y: labels, name: "Residual (Q)", orientation: "h" }
        ];
        const layout = {
          margin: { t: 40, r: 20, b: 40, l: 160 },
          barmode: "group",
          title: `Contribution (Top ${labels.length}) @ t=${kStar}`,
          xaxis: { title: "Magnitude (absolute)" }
        };
        Plotly.newPlot("plot-contrib", traces, layout, {responsive:true, displaylogo:false});

        window.ReportData.contribAt = kStar;
      }
      renderContrib((window.ReportData && window.ReportData.contribAt) ?? 0);
      document.getElementById("btnApplyK").addEventListener("click", () => {
        const v = parseInt(document.getElementById("kSelect").value, 10);
        const k = isNaN(v) ? (window.ReportData?.contribAt ?? 0) : v;
        renderContrib(k);
      });

      // === SHAP (optional)
      (async function renderSHAP() {
        const shapDiv = document.getElementById("plot-shap");
        function drawSHAP(items) {
          const x = items.map(d => d.feature);
          const y = items.map(d => d.score);
          return Plotly.newPlot("plot-shap", [{ type: "bar", x, y, name: "Impact (mean |SHAP|)" }], {
            title: "Which sensors influence PT501 predictions?",
            margin: { t: 40, r: 20, b: 80, l: 60 },
            xaxis: { tickangle: -30 },
            yaxis: { title: "Mean |SHAP| (aggregated over time)" },
            paper_bgcolor: "#1f2937", plot_bgcolor: "#1f2937",
            font: { color: "#fff" }
          }, { responsive: true, displaylogo: false });
        }
        let items = null;
        if (res?.shap?.feature_importance && Array.isArray(res.shap.feature_importance)) {
          items = res.shap.feature_importance;
        }
        if (!items) {
          try {
            const r = await fetch("shap_importance_pt501.json", { cache: "no-store" });
            if (r.ok) {
              const data = await r.json();
              if (data?.feature_importance && Array.isArray(data.feature_importance)) {
                items = data.feature_importance;
              }
            }
          } catch {}
        }
        if (items && items.length) {
          await drawSHAP(items.slice(0, 15));
        } else {
          shapDiv.style.display = "none";
          meta.insertAdjacentHTML("beforeend", `<div class="mt-1 text-gray-400">SHAP importance not available for PT501.</div>`);
        }
      })();

      // === PDF Generation
      async function plotToPNG(divId, scale = 2) {
        const el = document.getElementById(divId);
        await Plotly.Plots.resize(el);
        return await Plotly.toImage(el, { format: "png", scale });
      }
      document.getElementById("btnReport").addEventListener("click", async () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });

        // Header
        const title = "Predictive Maintenance Report — PT501";
        doc.setFont("helvetica", "bold"); doc.setFontSize(16);
        doc.text(title, 14, 16);
        doc.setFont("helvetica", "normal"); doc.setFontSize(10);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 22);

        const rd = window.ReportData || {};
        const cva = rd.cva || {};
        const t2Breach = Array.isArray(cva.T2) && isFinite(cva.T2_UCL) ? cva.T2.some(v => v > cva.T2_UCL) : false;
        const qBreach  = Array.isArray(cva.Q) && isFinite(cva.Q_UCL)  ? cva.Q.some(v => v > cva.Q_UCL)  : false;

        // Summary
        let y = 30;
        doc.setFontSize(12); doc.setFont("helvetica","bold");
        doc.text("1) Summary", 14, y);
        y += 6; doc.setFontSize(10); doc.setFont("helvetica","normal");
        doc.text(`T² exceeded UCL: ${t2Breach ? "Yes" : "No"} (UCL=${(cva.T2_UCL ?? "n/a")})`, 14, y); y += 5;
        doc.text(`Q exceeded UCL: ${qBreach ? "Yes" : "No"} (UCL=${(cva.Q_UCL ?? "n/a")})`, 14, y); y += 8;

        // Recommendation
        doc.setFontSize(12); doc.setFont("helvetica","bold");
        doc.text("2) Maintenance Recommendation", 14, y);
        y += 6; doc.setFontSize(10); doc.setFont("helvetica","normal");
        let rec = "System operating within control limits. No immediate action required.";
        if (t2Breach && qBreach) rec = "Immediate inspection recommended — process anomaly detected (T² & Q exceeded).";
        else if (t2Breach || qBreach) rec = "Potential drift detected — schedule maintenance check and monitor closely.";
        const recLines = doc.splitTextToSize(rec, 182);
        doc.text(recLines, 14, y);
        y += 10 + recLines.length * 1.8;

        // Fault windows table
        doc.setFontSize(12); doc.setFont("helvetica","bold");
        doc.text("3) Abnormal Time Windows (exceeded threshold)", 14, y);
        y += 6; doc.setFontSize(10); doc.setFont("helvetica","normal");
        const rows = (cva.faultRanges || []);
        doc.text("No.", 16, y);
        doc.text("Start", 36, y);
        doc.text("End",   96, y);
        doc.text("Duration", 156, y);
        doc.text("Max T² / Q", 178, y);
        y += 4;
        for (let idx = 0; idx < rows.length; idx++) {
          const r = rows[idx];
          if (y > 270) { doc.addPage(); y = 20; }
          doc.text(String(idx + 1), 16, y);
          doc.text(String(r.start), 36, y);
          doc.text(String(r.end),   96, y);
          doc.text(r.durationLabel || "—", 156, y);
          doc.text(`${(r.maxT2 ?? 0).toFixed(2)} / ${(r.maxQ ?? 0).toFixed(2)}`, 178, y);
          y += 6;
        }

        // Charts page
        doc.addPage();
        doc.setFontSize(12); doc.setFont("helvetica","bold");
        doc.text("4) Diagnostic Charts", 14, 16);
        doc.setFont("helvetica","normal"); doc.setFontSize(10);

        const predsPNG   = await plotToPNG("plot-preds", 2);
        const cvaPNG     = await plotToPNG("plot-cva", 2);
        const contribPNG = await plotToPNG("plot-contrib", 2);
        let shapPNG = null;
        const shapEl = document.getElementById("plot-shap");
        if (shapEl && shapEl.data) shapPNG = await plotToPNG("plot-shap", 2);

        let imgY = 22;
        const imgW = 180, imgH = 80;
        doc.addImage(predsPNG,   "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
        doc.addImage(cvaPNG,     "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
        if (imgY > 250) { doc.addPage(); imgY = 20; }
        doc.addImage(contribPNG, "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
        if (shapPNG) {
          if (imgY > 250) { doc.addPage(); imgY = 20; }
          doc.addImage(shapPNG, "PNG", 14, imgY, imgW, imgH);
        }

        doc.save("Maintenance_Report_PT501.pdf");
      });
    })();
  </script>
</body>
</html>
