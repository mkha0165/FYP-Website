<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload CSV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Sidebar independent scroll */
    #historySidebar {
      max-height: 90vh; /* prevents full-page scroll */
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.4) transparent;
    }
    #historySidebar::-webkit-scrollbar { width: 8px; }
    #historySidebar::-webkit-scrollbar-thumb {
      background-color: rgba(255,255,255,0.4);
      border-radius: 4px;
    }
    #historySidebar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body class="h-screen w-screen bg-gradient-to-br from-gray-800 to-black flex justify-center items-center">

  <div class="flex w-full max-w-6xl bg-white/10 backdrop-blur-md rounded-3xl overflow-hidden">
    <!-- LEFT: Upload section -->
    <div class="flex-1 p-10 text-center">
      <div class="flex justify-between items-center mb-4">
        <p class="text-sm text-white">
          Logged in as: <span id="loggedInUser" class="font-semibold">User</span>
        </p>
        <button id="logoutBtn"
          class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-6 rounded-full">
          Logout
        </button>
      </div>

      <h2 class="text-2xl font-bold text-white mb-6">Upload CSV File</h2>

      <!-- Target selector -->
      <div class="mb-6">
        <label for="targetSelect" class="block text-white text-lg mb-2 font-medium">Select Target Variable</label>
        <select id="targetSelect"
          class="w-full bg-white/20 text-white p-3 rounded-xl text-center border border-white/30 focus:outline-none">
          <option value="PT501">PT501 - Pressure in 3 Phase Separator</option>
          <option value="FT305">FT305 - Flow Rate Input Air</option>
          <option value="FT104">FT104 - Density Water Input</option>
          <option value="FT407">FT407 - Temperature Top Riser</option>
          <option value="LI504">LI504 - Level Gas-Liquid 3 Phase Separator</option>
          <option value="VC501">VC501 - Position of Valve</option>
        </select>
      </div>

      <div id="dropZone"
        class="bg-white/20 border-2 border-dashed border-white/50 rounded-xl p-10 text-white mb-4 cursor-pointer"
      >
        <svg class="w-16 h-16 mb-4 mx-auto" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1M4 12l4-4m0 0l4 4m-4-4v12" />
        </svg>
        <p class="text-lg font-medium">Drag and Drop your CSV Files here</p>
        <p class="text-md">or Click To Browse</p>
        <input type="file" id="fileInput" accept=".csv" class="hidden" />
      </div>

      <button id="browseBtn"
        class="bg-gradient-to-r from-gray-700 to-black py-3 px-9 text-white rounded-full mb-4">
        Browse Files
      </button>

      <div id="uploadStatus" class="text-white mt-4 min-h-6"></div>
    </div>

    <!-- Scrollable Result History Sidebar -->
    <div id="historySidebar" class="w-72 bg-black/40 border-l border-white/20 p-6 text-white">
      <h3 class="text-xl font-bold mb-4 border-b border-white/30 pb-2">Result History</h3>
      <ul id="historyList" class="space-y-3 text-left text-sm"></ul>
    </div>
  </div>

  <script>
    /* ===== Login protection ===== */
    const loggedInUser = localStorage.getItem("loggedInUser");
    if (!loggedInUser) {
      alert("You must log in first!");
      window.location.href = "login.html";
    } else {
      document.getElementById("loggedInUser").textContent = loggedInUser;
    }

    /* ===== IndexedDB helpers for big results ===== */
    const IDB_DB_NAME = 'predictions-db';
    const IDB_STORE   = 'results';

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(IDB_DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbPutResult(result) {
      const db = await idbOpen();
      const id = `${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put({ id, result });
        tx.oncomplete = () => resolve(id);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDeleteResult(id) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    /* ===== Logout ===== */
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    });

    /* ===== Elements ===== */
    const fileInput = document.getElementById("fileInput");
    const dropZone = document.getElementById("dropZone");
    const browseBtn = document.getElementById("browseBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const targetSelect = document.getElementById("targetSelect");

    // ===== API config =====
    const BASE_API = "http://127.0.0.1:8000/predict"; // change if deployed

    async function postFileToAPI(file, target) {
      const formData = new FormData();
      formData.append("file", file);

      uploadStatus.innerHTML = `<span class="text-gray-200">Uploading <strong>${file.name}</strong>…</span>`;
      browseBtn.disabled = true;
      dropZone.classList.add("pointer-events-none", "opacity-60");

      const url = `${BASE_API}?target=${encodeURIComponent(target)}`;
      const res = await fetch(url, { method: "POST", body: formData });

      browseBtn.disabled = false;
      dropZone.classList.remove("pointer-events-none", "opacity-60");

      if (!res.ok) {
        const msg = await res.text();
        throw new Error(msg || "Upload failed");
      }
      return res.json();
    }

    async function handleFile(file) {
      if (!file) return;
      if (!file.name.toLowerCase().endsWith(".csv")) {
        uploadStatus.innerHTML = `<span class="text-yellow-300">Please upload a .csv file.</span>`;
        return;
      }

      const target = targetSelect.value;
      try {
        const result = await postFileToAPI(file, target);

        // Put big payload into IndexedDB; store pointer + selectedTarget in sessionStorage
        const pointer = await idbPutResult(result);
        sessionStorage.setItem("predictionPointer", pointer);
        sessionStorage.setItem("selectedTarget", target);
        sessionStorage.removeItem("predictionResult"); // ensure old key is gone

        uploadStatus.innerHTML = `<span class="text-green-400 font-semibold">${file.name} processed successfully. Redirecting…</span>`;

        // Save compact history entry: only pointer + dataset_id
        await saveToHistory(file.name, { pointer, dataset_id: result?.dataset_id ?? null });

        window.location.href = "prediction.html";
      } catch (err) {
        uploadStatus.innerHTML = `<div class="text-red-400 mt-2 break-words">Error: ${err.message}</div>`;
      }
    }

    /* ===== Drag & Drop & Browse ===== */
    dropZone.addEventListener("click", () => fileInput.click());
    dropZone.addEventListener("dragover", (e) => e.preventDefault());
    dropZone.addEventListener("drop", (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files?.[0];
      handleFile(file);
    });
    browseBtn.addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      handleFile(file);
    });

    /* ===== Result History ===== */
    function loadHistory() {
      const username = localStorage.getItem("loggedInUser");
      const history = JSON.parse(localStorage.getItem(`history_${username}`) || "[]");
      const historyList = document.getElementById("historyList");

      historyList.innerHTML = "";
      if (history.length === 0) {
        historyList.innerHTML = `<li class="text-gray-400 italic">No uploads yet</li>`;
        return;
      }

      history.forEach((item, i) => {
        const li = document.createElement("li");
        li.className = "bg-white/10 p-3 rounded-lg hover:bg-white/20 transition";
        li.innerHTML = `
          <div class="flex justify-between items-center">
            <div class="flex-1 min-w-0">
              <p class="font-semibold truncate">${item.filename}</p>
              <p class="text-xs text-gray-300">${item.date}</p>
              ${item.dataset_id ? `<p class="text-[11px] text-gray-400">Dataset: ${item.dataset_id}</p>` : ""}
            </div>
            <div class="flex gap-1 ml-2 shrink-0">
              <button class="bg-gray-700 hover:bg-gray-600 px-2 py-1 rounded text-xs" data-view="${i}">
                View
              </button>
              <button class="text-red-400 hover:text-red-600 text-lg font-bold leading-none" data-remove="${i}">
                ✖
              </button>
            </div>
          </div>
        `;
        historyList.appendChild(li);
      });

      // View
      document.querySelectorAll("[data-view]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          const index = e.target.dataset.view;
          const username = localStorage.getItem("loggedInUser");
          const history = JSON.parse(localStorage.getItem(`history_${username}`) || "[]");
          const record = history[index];
          if (record && record.pointer) {
            sessionStorage.setItem("predictionPointer", record.pointer);
            sessionStorage.removeItem("predictionResult");
            window.location.href = "prediction.html";
          }
        });
      });

      // Remove
      document.querySelectorAll("[data-remove]").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const index = parseInt(e.target.dataset.remove);
          const username = localStorage.getItem("loggedInUser");
          const historyKey = `history_${username}`;
          const history = JSON.parse(localStorage.getItem(historyKey) || "[]");
          const rec = history[index];
          if (rec?.pointer) {
            try { await idbDeleteResult(rec.pointer); } catch {}
          }
          history.splice(index, 1);
          localStorage.setItem(historyKey, JSON.stringify(history));
          loadHistory();
        });
      });
    }

    async function saveToHistory(filename, info) {
      const username = localStorage.getItem("loggedInUser");
      const historyKey = `history_${username}`;
      const history = JSON.parse(localStorage.getItem(historyKey) || "[]");

      const entry = {
        filename,
        date: new Date().toLocaleString(),
        pointer: info.pointer,
        dataset_id: info.dataset_id || null
      };

      history.unshift(entry);
      localStorage.setItem(historyKey, JSON.stringify(history.slice(0, 10)));
      loadHistory();
    }

    document.addEventListener("DOMContentLoaded", loadHistory);
  </script>
</body>
</html>
