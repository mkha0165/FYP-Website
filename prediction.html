<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>  Prediction Results (${targetName})</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Plotly -->
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <!-- jsPDF (for PDF export) -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body class="min-h-screen bg-gray-900 text-white p-6">
  <!-- Top bar with logout button -->
  <div class="flex justify-end mb-4">
    <button id="logoutBtn"
      class="bg-red-600 hover:bg-red-700 text-white font-semibold py-2 px-4 rounded">
      Logout
    </button>
  </div>

  <div class="max-w-6xl mx-auto">
    <h1 id="prediction-title" class="text-2xl font-bold mb-4">
      <h2 class="text-center mb-4">
        Prediction Results
      </h2>
    </h1>

    <div id="meta" class="mb-6 text-sm text-gray-300"></div>

    <div id="plot-preds" class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[500px]"></div>
    <div id="plot-cva"   class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[600px]"></div>

    <!-- Contribution plot (with % toggle) -->
    <div class="bg-gray-800 rounded-xl p-4 mb-6 w-full">
      <div class="flex items-center justify-between mb-2">
        <h2 class="text-lg font-semibold">Contribution (C) – Top Drivers</h2>
        <div class="flex items-center gap-3 text-sm text-gray-300">
          Focus @ t:
          <input id="kSelect" type="number" class="w-24 bg-gray-700 rounded-lg px-2 py-1" value="0" />
          <label class="inline-flex items-center gap-2 select-none">
            <input id="asPercent" type="checkbox" class="accent-blue-500">
            Show as %
          </label>
          <button id="btnApplyK" class="px-3 py-1 rounded-lg bg-slate-700 hover:bg-slate-600">Apply</button>
        </div>
      </div>
      <p class="text-xs text-gray-400 mb-2">
        Bars show variable-level contributions at the selected time index (retained-space C and residual-space Q).
        Toggle “Show as %” to normalize each set to 100% at that time.
      </p>
      <div id="plot-contrib" class="w-full h-[520px]"></div>
    </div>

    <div id="plot-shap"  class="bg-gray-800 rounded-xl p-4 mb-6 w-full h-[500px]"></div>

    <div class="flex gap-3">
      <button id="btnReport"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
        Download PDF Report
      </button>
      <!-- Export button will be injected after GT evaluation if available -->
    </div>
  </div>

  <script>
    /* ===== IndexedDB loader for prediction result ===== */
    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('predictions-db', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('results')) {
            db.createObjectStore('results', { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror   = () => reject(req.error);
      });
    }
    async function idbGetResult(pointer) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('results', 'readonly');
        const req = tx.objectStore('results').get(pointer);
        req.onsuccess = () => resolve(req.result ? req.result.result : null);
        req.onerror   = () => reject(req.error);
      });
    }
    async function loadResult() {
      const pointer = sessionStorage.getItem("predictionPointer");
      if (pointer) {
        const r = await idbGetResult(pointer);
        if (r) return r;
      }
      // legacy fallback (not recommended; may hit quota if huge)
      const inline = sessionStorage.getItem("predictionResult");
      if (inline) return JSON.parse(inline);
      return null;
    }

    /* ===== Start app after result is loaded ===== */
    (async () => {
      const res = await loadResult();
      if (!res) {
        alert("No prediction data found. Please upload a CSV first.");
        window.location.href = "upload.html";
        return;
      }

      // --- Helper: make short human explanations for variable names ---
      function explainVar(name) {
        const table = {
          PT501: "Pressure in 3 phase separator (MPa)",
          FT305: "Flow rate input air (Sm³/s)",
          FT104: "Flow rate input water (kg/s)",
          FT104_density: "Density of water input (kg/m³)",
          FT104_temp: "Temperature of water input (°C)",
          FT407: "Flow rate at top riser (kg/s)",
          FT407_density: "Density at top riser (kg/m³)",
          FT407_temp: "Temperature at top riser (°C)",
          LI504: "Level of gas-liquid 3 phase separator (%)",
          VC501: "Position of valve VC501 (%)",
          PT312: "Air delivery pressure (MPa)",
          PT401: "Pressure at the bottom of the riser (MPa)",
          PT408: "Pressure at the top of the riser (MPa)",
          PT403: "Pressure at the top separator (MPa)",
          PT408_diff: "Differential pressure (PT401 - PT408) (MPa)",
          PT403_diff: "Differential pressure over VC404 (MPa)",
          LI405: "Level in top separator (m)",
          FT406: "Flow rate top separator output (kg/s)",
          FT406_density: "Density at top separator output (kg/m³)",
          FT406_temp: "Temperature at top separator output (°C)",
          VC302: "Position of valve VC302 (%)",
          VC101: "Position of valve VC101 (%)",
          PO1: "Water pump current (A)"
        };
        return table[name] || "Process variable (unlisted in reference table)";
      }

    // Determine which target is selected
    const targetName =
      sessionStorage.getItem("selectedTarget") ||
      res?.target ||
      (Array.isArray(res.targets) ? res.targets[0] : "Unknown");

    // Define human-readable descriptions
    const targetDescriptions = {
      "PT501": "Pressure in 3 Phase Separator (MPA)",
      "FT305": "Flow Rate Input Air",
      "FT104": "Density of Water Input",
      "FT407": "Temperature at Top Riser",
      "LI504": "Level Gas-Liquid 3 Phase Separator",
      "VC501": "Position of Valve"
    };

    // Update title dynamically
    const titleElement = document.getElementById("prediction-title");
    titleElement.textContent = `Prediction Results (${targetName} - ${targetDescriptions[targetName] || "Unknown Variable"})`;

    // Check that the selected target exists in model output
    const j = Array.isArray(res.targets) ? res.targets.indexOf(targetName) : -1;
    if (j === -1) {
      document.getElementById("meta").innerHTML =
        `<div class="text-red-400">Error: ${targetName} not found in model targets.</div>`;
      throw new Error(`${targetName} not in targets`);
    }



      const t = res.time_index || [];
      const hasTruth = Array.isArray(res.y_true) && res.y_true.length > 0;

      // === Meta info ===
      const meta = document.getElementById("meta");
      meta.innerHTML = `
        <div>Target variable: <code>${targetName}</code> (MPa)</div>
        ${hasTruth ? "" : "<div class='text-yellow-400 mt-1'>No ground-truth values — predictions only.</div>"}
      `;

      // === Plot configs ===
      const baseLayout = {
        margin: { t: 40, r: 20, b: 50, l: 50 },
        hovermode: "x unified",
        dragmode: "pan",
        uirevision: true,
        legend: { orientation: "h", y: -0.2, font: { size: 11 } }
      };
      const baseConfig = {
        responsive: true, displaylogo: false, scrollZoom: true,
        modeBarButtonsToRemove: [
          "select2d","lasso2d","zoom","zoomIn2d","zoomOut2d","autoScale2d","resetScale2d","toggleSpikelines"
        ]
      };

      // === PT501 Predictions (no residuals) ===
      const yPred = (res.y_pred || []).map(r => r[j]);
      let yTrue = null;
      if (hasTruth) {
        // Accept either shape: y_true[n] = value or array
        yTrue = res.y_true.map(row => Array.isArray(row) ? row[j] : row);
      }

    const n = yTrue ? yTrue.length : 0;  // number of ground-truth points

    const tracesPred = [{
      x: t, y: yPred, mode: "lines", name: `${targetName} Predicted`, yaxis: "y1"
    }];
    if (hasTruth) {
      tracesPred.push({
        x: t.slice(0, n), y: yTrue.slice(0, n),
        mode: "lines", name: `${targetName} Actual`, yaxis: "y1"
      });
    }

    Plotly.newPlot("plot-preds", tracesPred, {
      ...baseLayout,
      title: hasTruth ? `${targetName}: Predicted vs Actual` : `Predicted ${targetName}`,
      yaxis: { title: "Value (MPa)" }
    }, baseConfig);


      // Keep a global to assemble the report later
      window.ReportData = {};

      // === CVA plot (shade per-plot only where that metric exceeds its threshold) ===
      (() => {
        // 1) Raw arrays
        let tCVA = (res.cva?.t || []).slice();
        let T2   = (res.cva?.T2 || []).slice();
        let Q    = (res.cva?.Q  || []).slice();
        const T2_UCL = Number(res.cva?.T2_UCL ?? 0);
        const Q_UCL  = Number(res.cva?.Q_UCL  ?? 0);

        if (!tCVA.length || !T2.length || !Q.length) {
          document.getElementById("plot-cva").innerHTML =
            "<div class='text-yellow-400'>CVA not available (missing arrays or UCLs).</div>";
          return;
        }

        // 2) Burn-in (first samples spike due to block formation)
        const burnIn = Math.min(50, T2.length - 1);
        if (burnIn > 0) {
          tCVA = tCVA.slice(burnIn);
          T2   = T2.slice(burnIn);
          Q    = Q.slice(burnIn);
        }

        // 3) Masks and windows
        const maskT2  = T2.map(v => v > T2_UCL);
        const maskQ   = Q.map(v => v > Q_UCL);
        const maskAny = maskT2.map((v,i) => v || maskQ[i]);

        function findWindows(mask) {
          const wins = [];
          let i = 0;
          while (i < mask.length) {
            if (mask[i]) {
              const s = i;
              while (i < mask.length && mask[i]) i++;
              wins.push([s, i - 1]);
            } else i++;
          }
          return wins;
        }

        const windowsT2  = findWindows(maskT2);
        const windowsQ   = findWindows(maskQ);
        const windowsAny = findWindows(maskAny); // for the table/PDF

        // 4) Traces
        const tracesCVA = [
          { x: tCVA, y: T2, mode: "lines", name: "T²", xaxis: "x",  yaxis: "y"  },
          { x: tCVA, y: tCVA.map(() => T2_UCL), mode: "lines", name: "T² UCL", line: { dash: "dash" }, xaxis: "x",  yaxis: "y"  },
          { x: tCVA, y: Q,  mode: "lines", name: "Q",  xaxis: "x2", yaxis: "y2" },
          { x: tCVA, y: tCVA.map(() => Q_UCL),  mode: "lines", name: "Q UCL",  line: { dash: "dash" }, xaxis: "x2", yaxis: "y2" }
        ];

        // 5) Axis ranges (cap for readability)
        const capT2 = 1e4, capQ = 1e4;
        const maxT2 = Math.max(...T2), maxQ = Math.max(...Q);

        // 6) Shapes & annotations (shade only on the subplot that breaches)
        const shapes = [];
        const annotations = [];
        const maxWindowsToDraw = 20;

        // T²-only shading on top subplot
        for (let k = 0; k < Math.min(maxWindowsToDraw, windowsT2.length); k++) {
          const [s, e] = windowsT2[k];
          const x0 = tCVA[s], x1 = tCVA[e];

          shapes.push(
            { type: "rect", xref: "x", yref: "paper", x0, x1, y0: 0.52, y1: 0.98, fillcolor: "rgba(255,99,71,0.15)", line: { width: 0 } },
            { type: "line", xref: "x", yref: "y", x0, x1: x0, y0: 0, y1: Math.min(capT2, maxT2*1.1), line: { color: "tomato", width: 1, dash: "dot" } },
            { type: "line", xref: "x", yref: "y", x0: x1, x1, y0: 0, y1: Math.min(capT2, maxT2*1.1), line: { color: "tomato", width: 1, dash: "dot" } }
          );

          annotations.push(
            { x: x0, y: Math.min(capT2, maxT2*1.15), xref: "x", yref: "y", text: "Fault Start", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" },
            { x: x1, y: Math.min(capT2, maxT2*1.15), xref: "x", yref: "y", text: "Fault End", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" }
          );
        }

        // Q-only shading on bottom subplot
        for (let k = 0; k < Math.min(maxWindowsToDraw, windowsQ.length); k++) {
          const [s, e] = windowsQ[k];
          const x0 = tCVA[s], x1 = tCVA[e];

          shapes.push(
            { type: "rect", xref: "x2", yref: "paper", x0, x1, y0: 0.02, y1: 0.48, fillcolor: "rgba(255,99,71,0.15)", line: { width: 0 } },
            { type: "line", xref: "x2", yref: "y2", x0, x1: x0, y0: 0, y1: Math.min(capQ, maxQ*1.1), line: { color: "tomato", width: 1, dash: "dot" } },
            { type: "line", xref: "x2", yref: "y2", x0: x1, x1, y0: 0, y1: Math.min(capQ, maxQ*1.1), line: { color: "tomato", width: 1, dash: "dot" } }
          );

          annotations.push(
            { x: x0, y: Math.min(capQ, maxQ*1.15), xref: "x2", yref: "y2", text: "Fault Start", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" },
            { x: x1, y: Math.min(capQ, maxQ*1.15), xref: "x2", yref: "y2", text: "Fault End", showarrow: true, arrowhead: 2, ax: 0, ay: -30, font: { color: "tomato", size: 12 }, bgcolor: "rgba(255,99,71,0.15)" }
          );
        }

        // 7) Layout
        const layoutCVA = {
          ...baseLayout,
          title: "CVA Indices (Raw)",
          height: 600,
          grid: { rows: 2, columns: 1, pattern: "independent" },
          xaxis:  { title: "Time" },
          yaxis:  { title: "Hotelling T²", range: [0, Math.min(capT2, maxT2*1.2)] },
          xaxis2: { title: "Time" },
          yaxis2: { title: "Squared Prediction Error Q", range: [0, Math.min(capQ, maxQ*1.2)] },
          shapes,
          annotations
        };

        Plotly.newPlot("plot-cva", tracesCVA, layoutCVA, baseConfig);

        // 8) Breach rates (separate)
        const rateT2 = maskT2.length ? maskT2.filter(Boolean).length / maskT2.length : 0;
        const rateQ  = maskQ.length  ? maskQ.filter(Boolean).length  / maskQ.length  : 0;
        meta.insertAdjacentHTML("beforeend",
          `<div class="mt-1">T² breach rate: <strong>${(rateT2*100).toFixed(2)}%</strong></div>`);
        meta.insertAdjacentHTML("beforeend",
          `<div class="mt-1">Q breach rate: <strong>${(rateQ*100).toFixed(2)}%</strong></div>`);

        // union windows with exact x values for report
        const faultRanges = (function buildRanges() {
          function findWindows(mask) {
            const arr = []; let i=0;
            while (i < mask.length) {
              if (mask[i]) { const s=i; while (i<mask.length && mask[i]) i++; arr.push([s,i-1]); }
              else i++;
            }
            return arr;
          }
          const wins = findWindows(maskAny);
          return wins.map(([s,e])=>{
            const x0=tCVA[s], x1=tCVA[e];
            let durationLabel="—";
            const d0=new Date(x0), d1=new Date(x1);
            if (!isNaN(d0) && !isNaN(d1)) durationLabel=((d1-d0)/1000).toFixed(1)+" s";
            else if (isFinite(Number(x0)) && isFinite(Number(x1))) durationLabel=String(Number(x1)-Number(x0));
            return {
              startIdx:s, endIdx:e, start:String(x0), end:String(x1),
              durationLabel, maxT2:Math.max(...T2.slice(s,e+1)), maxQ:Math.max(...Q.slice(s,e+1))
            };
          });
        })();

        window.ReportData.cva = { t: tCVA, T2, Q, T2_UCL, Q_UCL, faultRanges };

        // default k*: first breach else argmax normalized
        const T2N = T2_UCL ? T2.map(v=>v/T2_UCL) : T2;
        const QN  = Q_UCL  ? Q.map(v=>v/Q_UCL)   : Q;
        let kStar = -1;
        for (let i=0;i<T2.length;i++){ if (T2N[i]>1 || QN[i]>1){ kStar=i; break; } }
        if (kStar<0) {
          let best=-Infinity, arg=0;
          for (let i=0;i<T2.length;i++){ const s=Math.max(T2N[i],QN[i]); if (s>=best){best=s; arg=i;} }
          kStar=arg;
        }
        window.ReportData.contribAt = kStar;
        document.getElementById("kSelect").value = kStar;
      })();

      // === Contribution plot (supports % toggle) ===
      function renderContrib(kStar) {
        const container = document.getElementById("plot-contrib");
        const contrib = res.cva?.contrib;
        if (!contrib) {
          container.innerHTML = "<div class='text-yellow-400'>Contribution arrays not available.</div>";
          return;
        }
        const names = contrib.features || [];
        const Ctot  = contrib.C_total || []; // retained-space (can be signed)
        const Cq    = contrib.C_q     || []; // residual Q (>=0)
        if (!names.length || !Ctot.length) {
          container.innerHTML = "<div class='text-yellow-400'>No contribution data.</div>";
          return;
        }
        const m = names.length;
        const N = (Ctot[0] || []).length;
        if (kStar == null || isNaN(kStar) || kStar < 0) kStar = 0;
        if (kStar >= N) kStar = N - 1;

        // Magnitudes per variable at time k
        const takeAbs = (M, k) => Array.from({length:m}, (_,j)=> Math.abs((M[j]||[])[k] || 0));
        const vTotAbs = takeAbs(Ctot, kStar);  // retained |C|
        const vQAbs   = takeAbs(Cq,   kStar);  // residual Q already nonneg

        const asPercent = !!document.getElementById("asPercent")?.checked;

        function toPercent(vec) {
          const s = vec.reduce((a,b)=>a+b, 0);
          if (!isFinite(s) || s <= 0) return vec.map(() => 0);
          return vec.map(v => 100 * v / s);
        }

        const valsTotRaw = vTotAbs;
        const valsQRaw   = vQAbs;
        const valsTot    = asPercent ? toPercent(valsTotRaw) : valsTotRaw;
        const valsQ      = asPercent ? toPercent(valsQRaw)   : valsQRaw;

        // Rank by retained (or by percent if toggled)
        const score = asPercent ? valsTot : valsTotRaw;
        const order = score.map((v,i)=>[v,i]).sort((a,b)=> b[0]-a[0]).slice(0, Math.min(10,m)).map(x=>x[1]);

        const labels  = order.map(i=> names[i]);
        const xTot    = order.map(i=> valsTot[i]);
        const xQ      = order.map(i=> valsQ[i]);

        // Store Top-3 for the PDF
        const top3Idx = order.slice(0, 3);
        const top3 = top3Idx.map(i => ({
          name: names[i],
          retained_abs: valsTotRaw[i],
          residual_abs: valsQRaw[i],
          note: explainVar(names[i])
        }));
        window.ReportData.top3 = { k: kStar, items: top3 };

        const hoverVal = asPercent ? "%{x:.2f}%" : "%{x:.4g}";
        const traces = [
          { type:"bar", x: xTot, y: labels, name: "C (retained)", orientation: "h",
            hovertemplate: "<b>%{y}</b><br>C (retained): "+hoverVal+"<extra></extra>" },
          { type:"bar", x: xQ,   y: labels, name: "Residual (Q)", orientation: "h",
            hovertemplate: "<b>%{y}</b><br>Residual Q: "+hoverVal+"<extra></extra>" }
        ];
        const layout = {
          margin: { t: 40, r: 20, b: 40, l: 160 },
          barmode: "group",
          title: `Contribution (Top ${labels.length}) @ t=${kStar}` + (asPercent ? " — % of total" : ""),
          xaxis: { title: asPercent ? "Share of total (%)" : "Magnitude (absolute)", range: asPercent ? [0, 100] : undefined }
        };
        Plotly.newPlot("plot-contrib", traces, layout, {responsive:true, displaylogo:false});

        window.ReportData.contribAt = kStar;
      }

      // Initial contribution render
      renderContrib((window.ReportData && window.ReportData.contribAt) ?? 0);

      // Manual selection + % toggle
      document.getElementById("btnApplyK").addEventListener("click", () => {
        const v = parseInt(document.getElementById("kSelect").value, 10);
        const k = isNaN(v) ? (window.ReportData?.contribAt ?? 0) : v;
        renderContrib(k);
      });
      document.getElementById("asPercent").addEventListener("change", () => {
        const k = window.ReportData?.contribAt ?? 0;
        renderContrib(k);
      });

    // === SHAP feature importance (robust: from res, or JSON, else hide) ===
    (async function renderSHAP() {
      const shapDiv = document.getElementById("plot-shap");
      const meta = document.getElementById("meta");

      function drawSHAP(items, targetName) {
        const x = items.map(d => d.feature);
        const y = items.map(d => d.score);

        return Plotly.newPlot("plot-shap", [{
          type: "bar",
          x,
          y,
          name: "Impact (mean |SHAP|)"
        }], {
          title: `Which sensors influence ${targetName} predictions?`,
          margin: { t: 40, r: 20, b: 80, l: 60 },
          xaxis: { tickangle: -30 },
          yaxis: { title: "Mean |SHAP| (aggregated over time)" },
          paper_bgcolor: "#1f2937",
          plot_bgcolor: "#1f2937",
          font: { color: "#fff" }
        }, { responsive: true, displaylogo: false });
      }

        let items = null;

      // Try 1: from session result (preferred)
      if (res?.shap?.[targetName]?.feature_importance && Array.isArray(res.shap[targetName].feature_importance)) {
        items = res.shap[targetName].feature_importance;
      } else if (res?.shap?.feature_importance && Array.isArray(res.shap.feature_importance)) {
        // Fallback if shap data is not nested by target
        items = res.shap.feature_importance;
      }

      // Try 2: load JSON dynamically (e.g. shap_importance_ft305.json)
      if (!items) {
        try {
          const shapJsonPath = `shap_importance_${targetName.toLowerCase()}.json`;
          const r = await fetch(shapJsonPath, { cache: "no-store" });
          if (r.ok) {
            const data = await r.json();
            if (data?.feature_importance && Array.isArray(data.feature_importance)) {
              items = data.feature_importance;
            }
          }
        } catch (e) {
          console.warn("SHAP fetch failed:", e);
        }
      }

      // Render or hide
      if (items && items.length) {
        await drawSHAP(items.slice(0, 15), targetName);
      } else {
        shapDiv.style.display = "none";
        meta.insertAdjacentHTML(
          "beforeend",
          `<div class="mt-1 text-gray-400">SHAP importance not available for ${targetName}.</div>`
        );
      }
    })();


      // === PDF Generation (unchanged layout, now includes contrib top-3) ===
      function fmtNum(x) {
        if (x == null || !isFinite(x)) return "—";
        if (Math.abs(x) >= 1e6 || (Math.abs(x) > 0 && Math.abs(x) < 1e-2)) return x.toExponential(2);
        return Number(x).toLocaleString(undefined, { maximumFractionDigits: 2 });
      }
      function rightText(doc, text, xRight, y) {
        const w = doc.getTextWidth(text);
        doc.text(text, xRight - w, y);
      }
      async function plotToPNG(divId, scale = 2) {
        const el = document.getElementById(divId);
        await Plotly.Plots.resize(el);
        return await Plotly.toImage(el, { format: "png", scale });
      }

      document.getElementById("btnReport").addEventListener("click", async () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });
        const PAGE_W = doc.internal.pageSize.getWidth();
        const PAGE_H = doc.internal.pageSize.getHeight();
        const LM = 14, RM = 14;
        const RIGHT = PAGE_W - RM;

      // --- Header
      const title = "Predictive Maintenance Report — ${targetName}";
      doc.setFont("helvetica", "bold");
      doc.setFontSize(16);
      doc.text(title, 14, 16);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 22);

        const rd = window.ReportData || {};
        const cva = rd.cva || {};
        const t2Breach = Array.isArray(cva.T2) && isFinite(cva.T2_UCL) ? cva.T2.some(v => v > cva.T2_UCL) : false;
        const qBreach  = Array.isArray(cva.Q) && isFinite(cva.Q_UCL)  ? cva.Q.some(v => v > cva.Q_UCL)  : false;

        let y = 30;

        // 1) Summary
        doc.setFont("helvetica","bold"); doc.setFontSize(12);
        doc.text("1) Summary", LM, y); y += 5.5;
        doc.setFont("helvetica","normal"); doc.setFontSize(10);
        doc.text(`T² exceeded UCL: ${t2Breach ? "Yes" : "No"} (UCL=${fmtNum(cva.T2_UCL)})`, LM, y); y += 4.5;
        doc.text(`Q exceeded UCL: ${qBreach ? "Yes" : "No"} (UCL=${fmtNum(cva.Q_UCL)})`, LM, y); y += 7;

        // 2) Maintenance Recommendation
        doc.setFont("helvetica","bold"); doc.setFontSize(12);
        doc.text("2) Maintenance Recommendation", LM, y); y += 5.5;
        doc.setFont("helvetica","normal"); doc.setFontSize(10);

        let rec = "System operating within control limits. No immediate action required.";
        if (t2Breach && qBreach)
          rec = "Immediate inspection recommended — process anomaly detected (T² & Q exceeded).";
        else if (t2Breach || qBreach)
          rec = "Potential drift detected — schedule maintenance check and monitor closely.";

        const recLines = doc.splitTextToSize(rec, PAGE_W - LM - RM);
        doc.text(recLines, LM, y);
        y += recLines.length * 4.2 + 1.5;

        // Top-3 Influencing Variables
        const top3 = (window.ReportData.top3 && window.ReportData.top3.items) ? window.ReportData.top3.items : [];
        const kStarForText = (window.ReportData.top3 && Number.isFinite(window.ReportData.top3.k)) ? window.ReportData.top3.k : null;

        if (top3.length) {
          doc.setFont("helvetica","bold");
          doc.text("Key Influencing Variables (Top 3)", LM, y);
          y += 5;

          doc.setFont("helvetica","normal");
          doc.setFontSize(10);
          const header = kStarForText != null
            ? `At time index t=${kStarForText}, the variables with the highest contributions to the anomaly are:`
            : `The variables with the highest contributions to the anomaly are:`;
          const headerLines = doc.splitTextToSize(header, PAGE_W - LM - RM);
          doc.text(headerLines, LM, y);
          y += headerLines.length * 4.2 + 1.8;

          top3.forEach((item, idx) => {
            if (y > PAGE_H - 20) { doc.addPage(); y = 16; }
            doc.setFont("helvetica","bold");
            doc.text(`${idx + 1}) ${item.name}`, LM, y);
            y += 4.2;

            doc.setFont("helvetica","normal");
            let desc = item.note || "";
            if (desc.trim().startsWith(item.name)) desc = desc.replace(item.name, "").trim().replace(/^[:\s-]+/, "");
            const descLines = doc.splitTextToSize(`${item.name}: ${desc}`, PAGE_W - LM - RM);
            doc.text(descLines, LM + 4, y);
            y += descLines.length * 4.2;

            const metrics = `Retained |C| = ${fmtNum(item.retained_abs)}, Residual Q = ${fmtNum(item.residual_abs)}`;
            doc.text(metrics, LM + 4, y);
            y += 6;
          });

          const varNames = top3.map(x => x.name).join(", ");
          const summary =
            `Based on the contribution analysis, the top three variables influencing the anomaly are ${varNames}. ` +
            `These process variables contributed most to fault detection, indicating that sensors or components related ` +
            `to these variables may require inspection, recalibration, or repair to restore normal operation.`;
          const summaryLines = doc.splitTextToSize(summary, PAGE_W - LM - RM);
          y += 2;
          doc.text(summaryLines, LM, y);
          y += summaryLines.length * 4.2 + 2;
        }

        // 3) Abnormal Time Windows (union)
        doc.setFont("helvetica","bold"); doc.setFontSize(12);
        doc.text("3) Abnormal Time Windows (exceeded threshold)", LM, y); y += 6;
        doc.setFont("helvetica","normal"); doc.setFontSize(10);

        const col = { no: LM + 2, start: LM + 24, end: LM + 74, dur: LM + 124, max: RIGHT };
        doc.text("No.", col.no, y);
        doc.text("Start", col.start, y);
        doc.text("End", col.end, y);
        doc.text("Duration", col.dur, y);
        rightText(doc, "Max T² / Q", col.max, y);
        y += 4;

        const rows = Array.isArray(cva.faultRanges) ? cva.faultRanges : [];
        const ROW_H = 5;

        for (let i = 0; i < rows.length; i++) {
          const r = rows[i];
          if (y > PAGE_H - 20) { doc.addPage(); y = 20; }
          doc.text(String(i + 1), col.no, y);
          doc.text(String(r.start ?? "—"), col.start, y);
          doc.text(String(r.end   ?? "—"), col.end,   y);
          doc.text(r.durationLabel || "—", col.dur, y);
          rightText(doc, `${fmtNum(r.maxT2)} / ${fmtNum(r.maxQ)}`, col.max, y);
          y += ROW_H;
        }

        // 4) Charts
        if (y > PAGE_H - 40) { doc.addPage(); y = 16; } else { y += 3; }
        doc.setFont("helvetica","bold"); doc.setFontSize(12);
        doc.text("4) Diagnostic Charts", LM, y);
        y += 4;
        doc.setFont("helvetica","normal"); doc.setFontSize(10);

      // Export current Plotly state as PNGs (what the user currently sees)
      const predsPNG = await plotToPNG("plot-preds", 2);
      const cvaPNG   = await plotToPNG("plot-cva", 2);
      let shapPNG = null;
      const shapEl = document.getElementById("plot-shap");
      if (shapEl && shapEl.data) {
        shapPNG = await plotToPNG("plot-shap", 2);
      }

      // Place images (fit width ~180mm)
      let imgY = 22;
      const imgW = 180, imgH = 80;
      doc.addImage(predsPNG, "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
      doc.addImage(cvaPNG,   "PNG", 14, imgY, imgW, imgH); imgY += imgH + 6;
      if (shapPNG) {
        if (imgY > 250) { doc.addPage(); imgY = 20; }
        doc.addImage(shapPNG, "PNG", 14, imgY, imgW, imgH);
      }

      // --- Save
      doc.save(`Maintenance_Report_${targetName}.pdf`);
    });
  </script>
</body>
</html>
